<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DormFlow Wireframe Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="canvas">
      <section class="phone">
        <header class="phone-header">
          <span class="dot"></span>
          <h1>DormFlow Prototype</h1>
          <span id="roleBadge" class="badge">Жилец</span>
        </header>
        <div id="app" class="screen" aria-live="polite"></div>
      </section>
      <aside class="notes">
        <h2>Как проверять</h2>
        <ol>
          <li>Нажимай кнопки внутри экрана.</li>
          <li>Проверь переходы в разделы и обратно.</li>
          <li>Смени роль кнопкой "Режим старосты".</li>
        </ol>
        <p>
          Это wireframe-прототип: без визуального дизайна, только сценарии и
          логика экранов.
        </p>
      </aside>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
